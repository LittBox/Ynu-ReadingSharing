<section class="slide light " data-layout-rule="L06" data-layout="C05" data-slide-id="competency-framework" data-animate="grid-reveal"><div class="ac-page"><nav class="ac-meta ac-top-nav" aria-label="章节导航"><span class="ac-nav-chapter">能力矩阵</span><div class="ac-nav-items"><button type="button" class="ac-nav-bubble" data-ac-page="0">开场问题</button><button type="button" class="ac-nav-bubble" data-ac-page="3">理论命题</button><button type="button" class="ac-nav-bubble" data-ac-page="10">就业数据</button><button type="button" class="ac-nav-bubble" data-ac-page="15">方向地图</button><button type="button" class="ac-nav-bubble" data-ac-page="20" aria-current="page">能力证据</button><button type="button" class="ac-nav-bubble" data-ac-page="24">案例经历</button><button type="button" class="ac-nav-bubble" data-ac-page="28">行动反思</button></div></nav><header class="ac-header" data-anim="line"><h1 class="ac-title" data-heading-role="claim">方向—能力—证据—误区</h1></header><main class="ac-body" data-anim="up"><div class="fd-content ac-stack"><table class="ac-table fd-table fd-overview-table"><thead><tr><th data-heading-role="column">方向</th><th data-heading-role="column">核心能力</th><th data-heading-role="column">可证明材料</th><th data-heading-role="column">常见误区</th></tr></thead><tbody><tr><td>去哪里</td><td>需要什么</td><td>如何证明</td><td>常见误判</td></tr><tr><td>先选具体方向，再考察入口</td><td>能力项按方向单写，不强行统一成一套词</td><td>把能力转成能被他人查看的作品、记录或结果</td><td>区分兴趣、证书、传闻与实际能力</td></tr><tr><td>职业方向是起点</td><td>同一能力在不同方向权重不同</td><td>证据形式随方向变化</td><td>矩阵用于自查，不是招聘标准</td></tr></tbody></table><p class="fd-takeaway">方向不同，能力与证据的对应方式也不同。</p></div></main><footer class="ac-footer"><span>内容依据：原始宣讲大纲。</span><span>21 / 30</span></footer></div></section>
