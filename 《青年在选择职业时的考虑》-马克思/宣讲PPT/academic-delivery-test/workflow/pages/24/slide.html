<section class="slide light " data-layout-rule="L02" data-layout="C02" data-slide-id="capability-evidence" data-animate="grid-reveal"><div class="ac-page"><nav class="ac-meta ac-top-nav" aria-label="章节导航"><span class="ac-nav-chapter">能力矩阵</span><div class="ac-nav-items"><button type="button" class="ac-nav-bubble" data-ac-page="0">开场问题</button><button type="button" class="ac-nav-bubble" data-ac-page="3">理论命题</button><button type="button" class="ac-nav-bubble" data-ac-page="10">就业数据</button><button type="button" class="ac-nav-bubble" data-ac-page="15">方向地图</button><button type="button" class="ac-nav-bubble" data-ac-page="20" aria-current="page">能力证据</button><button type="button" class="ac-nav-bubble" data-ac-page="24">案例经历</button><button type="button" class="ac-nav-bubble" data-ac-page="28">行动反思</button></div></nav><header class="ac-header" data-anim="line"><h1 class="ac-title" data-heading-role="claim">把“我喜欢”转成“我做过什么、能证明什么”</h1></header><main class="ac-body" data-anim="up"><div class="ac-stack fd-content"><div class="fd-cards fd-three"><article class="ac-point fd-card"><h3 class="fd-card-heading" data-heading-role="group"><span>01</span> 兴趣与能力</h3><div class="fd-card-body"><p>误区：把“感兴趣”当能力。</p><p>纠正：补充实际做过的任务与结果。</p></div></article><article class="ac-point fd-card"><h3 class="fd-card-heading" data-heading-role="group"><span>02</span> 证书与证据</h3><div class="fd-card-body"><p>误区：把“证书”当证据。</p><p>纠正：说明证书之外的实际表现。</p></div></article><article class="ac-point fd-card"><h3 class="fd-card-heading" data-heading-role="group"><span>03</span> 传闻与标准</h3><div class="fd-card-body"><p>误区：把“听说”当标准。</p><p>纠正：核对公开要求与可验证信息。</p></div></article></div><p class="fd-takeaway">选1—2个方向，各找3条可验证信息。</p></div></main><footer class="ac-footer"><span>同一能力可跨方向迁移，但证据形式不同。</span><span>24 / 30</span></footer></div></section>
